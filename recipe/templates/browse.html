<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
    <h1>Browse Recipes</h1>
    <p>Total Recipes: {{ num_recipe }}</p>
    <div class="recipe-list">
        {% for recipe in recipes %}
        <div class="recipe-item">
            <h3>{{ recipe.name }}</h3>
            <p>ID: {{ recipe.id }}</p>
            <p>Author: {{ recipe.author }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
